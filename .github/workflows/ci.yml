name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ is up to date
        run: |
          if ! git diff --exit-code --stat -- dist/; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

  # Runs the committed bundle as a real action against this PR: real GitHub API calls, real HTTP to a mock
  # model server. Dry run, so nothing is posted. Catches a broken dist/, action.yml or wiring.
  self-test:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - name: Start mock model server
        run: |
          node scripts/mock-ollama.mjs &
          for i in $(seq 1 20); do curl -s -o /dev/null localhost:11434 && break; sleep 0.5; done
      - id: review
        uses: ./
        with:
          provider: ollama
          model: mock
          dry-run: 'true'
          suggest-tests: 'true'
      - name: Check outputs
        env:
          STATUS: ${{ steps.review.outputs.status }}
          INLINE: ${{ steps.review.outputs.inline-comments }}
          SUGGESTIONS: ${{ steps.review.outputs.test-suggestions }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "status=$STATUS inline=$INLINE suggestions=$SUGGESTIONS"
          if [ "$EVENT" = pull_request ]; then
            test "$STATUS" = dry-run
            test "$INLINE" -ge 1  # the mock answers each request with one finding
            test "$SUGGESTIONS" -ge 0  # depends on whether the PR changes source without tests
          else
            test "$STATUS" = skipped
          fi
